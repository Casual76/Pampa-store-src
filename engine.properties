# Il Pampa Store non ospita i moduli del Fluid Engine: e' Compose Multiplatform, e i moduli sono
# librerie Android che non entrano in un source set condiviso col desktop. Ha invece un *porto* del
# look, scritto nel suo codice. Questo file esiste perche' quel porto sia contato insieme alle altre
# app quando l'engine si muove, invece di restare indietro senza che nessuno se ne accorga.
engine.mode=port
engine.version=1.1.1
engine.channel=stable
engine.portFile=shared/src/commonMain/kotlin/com/pampa/store/ui/theme/FluidPort.kt
engine.updatedAt=2026-08-23
